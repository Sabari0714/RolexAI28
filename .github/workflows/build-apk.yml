name: Build Rolex AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rolex-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.6.0"

      - name: Validate Python source
        run: |
          python -m compileall -q main.py modules tests tools
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Clean Buildozer state
        run: rm -rf .buildozer bin

      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RolexV2-debug-arm64
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RolexV2-build-log
          path: build.log
          if-no-files-found: ignore
