name: Build Rolex AI APK

on:
  push:
    branches: [main]
    paths:
      - buildozer.spec
  workflow_dispatch:

concurrency:
  group: rolex-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"
      - name: Validate source
        run: |
          python -m compileall -q main.py rolex_service.py
          python - <<'PY'
          import base64, glob, io, tarfile
          parts = sorted(glob.glob('rolex_core_*.b64'))
          assert len(parts) == 4, parts
          raw = base64.b64decode(''.join(open(p).read() for p in parts))
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as tf:
              names = tf.getnames()
          assert 'rolex_ai/app.py' in names
          assert 'rolex_ai/ui/rolex_ui.py' in names
          print('Embedded Rolex core bundle validated:', len(names), 'files')
          PY
      - name: Clean Buildozer state
        run: rm -rf .buildozer bin
      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log
      - name: Verify APK
        run: |
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sha256sum "$apk"
          ls -lh "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RolexAI-V38-debug-arm64
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RolexAI-V38-build-log
          path: build.log
          if-no-files-found: ignore
